spring:
  application:
    name: farmchain-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 60000
      initialization-fail-timeout: 120000
      connection-test-query: SELECT 1
      keepalive-time: 30000
      validation-timeout: 5000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

farmchain:
  jwt:
    secret: ${FARMCHAIN_JWT_SECRET}
    access-token-expiry-ms: 86400000
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: "https://farmchain-snowy.vercel.app,https://farmchain.vercel.app,http://localhost:5173,http://localhost:5174"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.farmchain: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO

gemini:
  api:
    key: ${GEMINI_API_KEY}
